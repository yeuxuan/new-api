# 本地开发基础设施：PostgreSQL + Redis（本体在宿主机 go run，前端 bun run dev）
#
# 用法:
#   make dev-api          # 只起数据库/Redis
#   make dev-local        # 宿主机运行 Go 后端（读取 .env）
#   make dev-web          # 前端 dev server → http://localhost:3001
#
# 或一键: make dev-infra && make dev-local   （后端、前端各开一个终端）
#
# 停止: docker compose -f docker-compose.dev.yml down
# 清数据: docker compose -f docker-compose.dev.yml down -v

services:
  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dev-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    ports:
      - "5432:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
